<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Backcasting hacia un servicio Pyme más proactivo</title><desc id="desc">Tres etapas conectan el futuro deseado con capacidades graduales y condiciones para empezar.</desc><rect width="1200" height="470" rx="28" fill="#f5f3ef"/><text x="56" y="67" fill="#ef5b20" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">BACKCASTING · DEL FUTURO A LAS CONDICIONES PRESENTES</text><path d="M100 205H1090" stroke="#c8c2b8" stroke-width="4" stroke-dasharray="8 10"/><g font-family="Arial,sans-serif"><circle cx="190" cy="205" r="20" fill="#ef5b20"/><circle cx="600" cy="205" r="20" fill="#ef5b20"/><circle cx="1010" cy="205" r="20" fill="#1e1c1a"/><rect x="58" y="250" width="265" height="157" rx="18" fill="#fff" stroke="#d8d3ca"/><text x="82" y="288" fill="#ef5b20" font-size="15" font-weight="700" letter-spacing="2">2028 · FUTURO DESEADO</text><text x="82" y="328" fill="#1e1c1a" font-size="21" font-weight="700">La pyme busca a su</text><text x="82" y="356" fill="#1e1c1a" font-size="21" font-weight="700">asesor para decidir.</text><text x="82" y="386" fill="#68635c" font-size="15">Confianza recíproca y valor.</text><rect x="468" y="250" width="265" height="157" rx="18" fill="#fff" stroke="#d8d3ca"/><text x="492" y="288" fill="#ef5b20" font-size="15" font-weight="700" letter-spacing="2">2027 · APRENDER</text><text x="492" y="328" fill="#1e1c1a" font-size="21" font-weight="700">Probar señales y</text><text x="492" y="356" fill="#1e1c1a" font-size="21" font-weight="700">preparación asistida.</text><text x="492" y="386" fill="#68635c" font-size="15">Con comparación y salvaguardas.</text><rect x="878" y="250" width="265" height="157" rx="18" fill="#1e1c1a"/><text x="902" y="288" fill="#f8a77f" font-size="15" font-weight="700" letter-spacing="2">2026 · HABILITAR</text><text x="902" y="328" fill="#fff" font-size="21" font-weight="700">Permisos, fuentes,</text><text x="902" y="356" fill="#fff" font-size="21" font-weight="700">rol y gobierno claros.</text><text x="902" y="386" fill="#d7d1c9" font-size="15">Sin esto, el futuro no escala.</text></g></svg>
