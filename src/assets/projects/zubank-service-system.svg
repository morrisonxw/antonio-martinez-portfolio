<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Sistema de servicio: IA detrás del asesor, relación humana con la pyme</title><desc id="desc">La pyme conversa con su asesora. Wanda apoya a la asesora; gobierno y riesgo habilitan el sistema.</desc><rect width="1200" height="560" rx="28" fill="#f5f3ef"/><text x="56" y="66" fill="#ef5b20" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">SISTEMA DE SERVICIO · RESPONSABILIDADES EXPLÍCITAS</text><g font-family="Arial,sans-serif"><rect x="72" y="175" width="260" height="170" rx="22" fill="#fff" stroke="#d8d3ca" stroke-width="2"/><text x="104" y="222" fill="#77716a" font-size="15" font-weight="700" letter-spacing="2">CLIENTE PYME</text><text x="104" y="268" fill="#1e1c1a" font-size="26" font-weight="700">Carlos</text><text x="104" y="304" fill="#67635e" font-size="17">Expone una decisión</text><text x="104" y="329" fill="#67635e" font-size="17">de crecimiento.</text><rect x="470" y="155" width="260" height="210" rx="22" fill="#1e1c1a"/><text x="502" y="207" fill="#d7d1c9" font-size="15" font-weight="700" letter-spacing="2">ASESORA</text><text x="502" y="253" fill="#fff" font-size="26" font-weight="700">Laura</text><text x="502" y="294" fill="#fff" font-size="17">Interpreta · pregunta</text><text x="502" y="321" fill="#fff" font-size="17">decide · recomienda</text><rect x="870" y="155" width="260" height="210" rx="22" fill="#fff" stroke="#ef5b20" stroke-width="2"/><text x="902" y="207" fill="#ef5b20" font-size="15" font-weight="700" letter-spacing="2">ASISTENCIA IA</text><text x="902" y="253" fill="#1e1c1a" font-size="26" font-weight="700">Wanda</text><text x="902" y="294" fill="#67635e" font-size="17">Organiza señales</text><text x="902" y="321" fill="#67635e" font-size="17">y prepara opciones.</text><path d="M350 260h98m-14-14 14 14-14 14" fill="none" stroke="#ef5b20" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M448 290H350m14-14-14 14 14 14" fill="none" stroke="#a9a39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M750 240h98m-14-14 14 14-14 14" fill="none" stroke="#ef5b20" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M848 282H750m14-14-14 14 14 14" fill="none" stroke="#a9a39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="420" width="720" height="86" rx="18" fill="#e8e5de"/><text x="278" y="454" fill="#1e1c1a" font-size="16" font-weight="700">GOBIERNO · RIESGO · DATOS</text><text x="278" y="482" fill="#67635e" font-size="16">Permisos, fuentes verificables, trazabilidad y compuertas.</text><path d="M600 407v-28" stroke="#a9a39a" stroke-width="3" stroke-dasharray="5 6"/></g></svg>
